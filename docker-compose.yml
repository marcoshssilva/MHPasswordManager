services:
  config:
    restart: on-failure
    build: &config-build
      context: .
      dockerfile: mhpasswordmanager-config-services/Dockerfile
    env_file:
      - etc/env/CONFIG-SERVICES.env
    environment:
      CONFIG_CONFIGSERVER_CRYPTO_PASSWORD: ${CONFIG_CONFIGSERVER_CRYPTO_PASSWORD:-}
      CONFIG_CONFIGSERVER_CRYPTO_ENABLED: "true"
      CONFIG_CONFIGSERVER_CRYPTO_LOCATION: /app/config-crypto/keystore.p12
    volumes:
      - config-crypto:/app/config-crypto
    depends_on:
      config-key-init:
        condition: service_completed_successfully
      eureka:
        condition: service_healthy
    networks:
      - net
#    ports:
#      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - apps
      - all
  config-key-init:
    build: *config-build
    environment:
      CONFIG_CONFIGSERVER_CRYPTO_PASSWORD: ${CONFIG_CONFIGSERVER_CRYPTO_PASSWORD:-}
    volumes:
      - config-crypto:/app/config-crypto
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$$CONFIG_CONFIGSERVER_CRYPTO_PASSWORD" || { echo "Set CONFIG_CONFIGSERVER_CRYPTO_PASSWORD" >&2; exit 1; }
        test -f /app/config-crypto/keystore.p12 && exit 0
        mkdir /app/config-crypto/.keygen-lock || { echo "Keystore generation already in progress" >&2; exit 1; }
        temp_dir=""
        cleanup() {
          if [ -n "$$temp_dir" ]; then
            rm -f "$$temp_dir/keystore.p12"
            rmdir "$$temp_dir"
          fi
          rmdir /app/config-crypto/.keygen-lock
        }
        trap cleanup EXIT
        test -f /app/config-crypto/keystore.p12 && exit 0
        umask 077
        temp_dir=$$(mktemp -d /app/config-crypto/.keygen.XXXXXX)
        keytool -genkeypair -alias config-server -keyalg RSA -keysize 2048 \
          -sigalg SHA256withRSA -validity 3650 \
          -dname "CN=MHPasswordManager Config Server" -storetype PKCS12 \
          -keystore "$$temp_dir/keystore.p12" \
          -storepass:env CONFIG_CONFIGSERVER_CRYPTO_PASSWORD -keypass:env CONFIG_CONFIGSERVER_CRYPTO_PASSWORD -noprompt
        mv "$$temp_dir/keystore.p12" /app/config-crypto/keystore.p12
    profiles:
      - apps
      - all
  eureka:
    restart: on-failure
    build:
      context: .
      dockerfile: mhpasswordmanager-service-registry/Dockerfile
    env_file:
      - etc/env/SERVICE-REGISTRY.env
    networks:
      - net
#    ports:
#      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - apps
      - all
  oauth2-server:
    restart: on-failure
    build:
      context: .
      dockerfile: mhpasswordmanager-oauth2-server/Dockerfile
    env_file:
      - etc/env/OAUTH2-AUTHORIZATION-SERVER.env
    environment: &config-client-environment
      SPRING_CLOUD_CONFIG_ENABLED: "true"
      SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED: "false"
      SPRING_CONFIG_IMPORT: "configserver:http://config:8888"
    depends_on:
      redis:
        condition: service_healthy
      eureka:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
      config:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - net
#    ports:
#      - "12010:12010"
    profiles:
      - apps
      - all
  gateway:
    restart: on-failure
    build:
      context: .
      dockerfile: mhpasswordmanager-api-gateway/Dockerfile
    env_file:
      - etc/env/API-GATEWAY.env
      - etc/env/MINIO-GATEWAY-API.env
    environment:
      MANAGEMENT_PORT: "8081"
    depends_on:
      eureka:
        condition: service_healthy
      user-service:
        condition: service_healthy
      password-service:
        condition: service_healthy
      email-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
      oauth2-server:
        condition: service_healthy
    networks:
      - net
    ports:
      - "${PORT:-8080}:8080"
      - "${MANAGEMENT_PORT:-8081}:8081"
    profiles:
      - apps
      - all
  user-service:
    restart: on-failure
    build:
      context: .
      dockerfile: mhpasswordmanager-user-service/Dockerfile
    env_file:
      - etc/env/USER-SERVICE.env
      - etc/env/MINIO-USERS-SERVICE.env
    environment: *config-client-environment
    depends_on:
      eureka:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
      config:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - net
#    ports:
#      - "12011:12011"
    profiles:
      - apps
      - all
  password-service:
    restart: on-failure
    build:
      context: .
      dockerfile: mhpasswordmanager-password-service/Dockerfile
    env_file:
      - etc/env/PASSWORD-SERVICE.env
      - etc/env/MINIO-PASSWORD-SERVICE.env
    environment: *config-client-environment
    depends_on:
      eureka:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
      config:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    networks:
      - net
#    ports:
#      - "12012:12012"
    profiles:
      - apps
      - all
  email-service:
    restart: on-failure
    build:
      context: .
      dockerfile: mhpasswordmanager-email-service/Dockerfile
    env_file:
      - etc/env/EMAIL-SERVICE.env
    environment: *config-client-environment
    networks:
      - net
#    ports:
#      - "12013:12013"
    depends_on:
      eureka:
        condition: service_healthy
      config:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailserver:
        condition: service_healthy
    profiles:
      - apps
      - all
  file-service:
    restart: on-failure
    build:
      context: .
      dockerfile: mhpasswordmanager-file-service/Dockerfile
    env_file:
      - etc/env/FILE-SERVICE.env
      - etc/env/MINIO-FILE-SERVICE.env
    environment: *config-client-environment
#    ports:
#      - "12014:12014"
    networks:
      - net
    depends_on:
      eureka:
        condition: service_healthy
      config:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    profiles:
      - apps
      - all
  postgres-db:
    restart: on-failure
    build:
      context: ./etc/docker/tool-postgres
    env_file:
      - etc/env/POSTGRES-DB.env
    networks:
      - net
    ports:
      - "5432:5432"
    volumes:
      - data-postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - tools
      - all
  redis:
    env_file:
      - etc/env/REDIS-STORE.env
    restart: on-failure
    build:
      context: ./etc/docker/tool-redis
    ports:
      - '6379:6379'
    volumes:
      - data-redis:/data
    networks:
      - net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - tools
      - all
  mongo:
    restart: on-failure
    build:
      context: ./etc/docker/tool-mongo
    env_file:
      - etc/env/MONGO-DB.env
    networks:
      - net
    volumes:
      - data-mongo-db:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ping:1})'"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - tools
      - all
  rabbitmq:
    restart: on-failure
    build:
      context: ./etc/docker/tool-rabbitmq
    env_file:
      - etc/env/RABBITMQ.env
    networks:
      - net
    volumes:
      - data-rabbitmq-data:/var/lib/rabbitmq
      - data-rabbitmq-logs:/var/log/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      - "25672:25672"
      - "15692:15692"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - tools
      - all
  mailserver:
    restart: on-failure
    build:
      context: ./etc/docker/tool-mail
    env_file:
      - etc/env/MAILSERVER.env
    networks:
      - net
    ports:
      - "1025:1025"
      - "1080:1080"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1025 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - tools
      - all
  minio:
    restart: on-failure
    build:
      context: ./etc/docker/tool-minio
    env_file:
      - etc/env/MINIO.env
    networks:
      - net
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - data-minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - tools
      - all
  minio-bootstrap:
    restart: "no"
    build:
      context: ./etc/docker/tool-minio
      dockerfile: Dockerfile.bootstrap
    env_file:
      - etc/env/MINIO.env
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - net
    profiles:
      - tools
      - all
networks:
  net:
    driver: bridge
volumes:
  config-crypto:
  data-postgres-db:
  data-redis:
  data-mongo-db:
  data-rabbitmq-logs:
  data-rabbitmq-data:
  data-minio:
